{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
	<div class="col-md-8">
		<h2 class="mb-4">Регистрация нового колониста</h2>
		<form method="POST" action="{{ url_for('register') }}">
			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="surname" class="form-label">Фамилия</label>
					<input
						type="text"
						class="form-control"
						id="surname"
						name="surname"
						required
					/>
				</div>
				<div class="col-md-6 mb-3">
					<label for="name" class="form-label">Имя</label>
					<input
						type="text"
						class="form-control"
						id="name"
						name="name"
						required
					/>
				</div>
			</div>
			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="age" class="form-label">Возраст</label>
					<input
						type="number"
						class="form-control"
						id="age"
						name="age"
						required
						min="0"
					/>
				</div>
				<div class="col-md-6 mb-3">
					<label for="position" class="form-label">Должность</label>
					<input
						type="text"
						class="form-control"
						id="position"
						name="position"
						required
					/>
				</div>
			</div>
			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="speciality" class="form-label">Профессия</label>
					<input
						type="text"
						class="form-control"
						id="speciality"
						name="speciality"
						required
					/>
				</div>
				<div class="col-md-6 mb-3">
					<label for="address" class="form-label">Адрес</label>
					<input
						type="text"
						class="form-control"
						id="address"
						name="address"
						required
					/>
				</div>
			</div>
			<div class="mb-3">
				<label for="email" class="form-label">Email</label>
				<input
					type="email"
					class="form-control"
					id="email"
					name="email"
					required
				/>
			</div>
			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="password" class="form-label">Пароль</label>
					<input
						type="password"
						class="form-control"
						id="password"
						name="password"
						required
					/>
				</div>
				<div class="col-md-6 mb-3">
					<label for="confirm_password" class="form-label"
						>Подтверждение пароля</label
					>
					<input
						type="password"
						class="form-control"
						id="confirm_password"
						name="confirm_password"
						required
					/>
				</div>
			</div>
			<button type="submit" class="btn btn-primary">Зарегистрироваться</button>
			<a href="{{ url_for('jobs_list') }}" class="btn btn-secondary">Отмена</a>
		</form>
	</div>
</div>
{% endblock %}
